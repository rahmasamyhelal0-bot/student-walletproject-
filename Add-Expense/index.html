<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expense | Student Wallet</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="add-expense">

        <div class="add-expense-header">
            <h2>Add New Expense</h2>

            <p>
                Record your expenses and keep track of your spending.
            </p>
        </div>


        <form class="expense-form">

        
            <div class="form-group">
                <div class="form-group">

    <label for="paymentMethod">Payment Method</label>

    <select id="paymentMethod" name="paymentMethod" required>
        <option value="">Select payment method</option>
        <option value="Cash">Cash</option>
        <option value="InstaPay">InstaPay</option>
        <option value="Vodafone Cash">Vodafone Cash</option>
    </select>

</div>

                <label for="amount">Amount</label>

                <div class="input-wrapper">

                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        placeholder="Enter amount"
                        min="1"
                        required
                    >

                    <span>EGP</span>

                </div>

                <small class="error-message" id="amountError"></small>

            </div 
            <div class="form-group">

                <label for="category">Category</label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    <option value="">Select category</option>

                    <option value="food">Food</option>

                    <option value="transportation">
                        Transportation
                    </option>

                    <option value="education">
                        Education
                    </option>

                    <option value="shopping">
                        Shopping
                    </option>

                </select>

                <small class="error-message" id="categoryError"></small>

            </div>


            
            <div class="form-group">

                <label for="date">Date</label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

                <small class="error-message" id="dateError"></small>

            </div>


            
            <div class="form-group">

                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Enter expense description"
                    rows="4"
                ></textarea>

            </div>


            
            <button
                type="submit"
                class="add-expense-btn"
            >
                Add Expense
            </button>

        </form>

        <div
            class="success-message"
            id="successMessage"
        >
            Expense added successfully!
        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
